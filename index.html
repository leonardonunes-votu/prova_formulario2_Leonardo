<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Formulário 2</title>
    <link rel="stylesheet" href="_css/style.css">
</head>
<body>
    <h1 id="title">Tech Runners</h1>
    <h2>Formulário para Runners</h2>
    <hr>

    <h2 class="title">Dados Pessoais:</h2>
    <form>
    Nome do Runner:<br>
    <input type="text" name="nome" required><br>

    Idade:<br>
    <input type="number" name="idade" required><br>
 
    E-mail:<br>
    <input type="email" name="email" required><br>

    Rede Social:<br>
    <input type="text" name="redeSocial" required><br>

    Endereço:<br>
    <input type="text" name="endereco" required><br>
   
    <hr>

    <fieldset>
        <legend><h2 class="title">Jogo:</h2></legend>

        <label>Nome do Jogo:</label>
        <input type="text" name="nomeJ"><br><br>
        <label>Sexo:</label> 
        <input type="radio" name="sexo" value="M"> Masculino
        <input type="radio" name="sexo" value="F"> Feminino
        <input type="radio" name="sexo" value="N"> Não Binário <br><br>

        <label>Categoria:</label>
        <select name="cat">
            <option value="">---------------</option>
            <option value="any">Any%</option>
            <option value="100">100%</option>
            <option value="allS">All Stage</option>
            <option value="allB">All Bosses</option>
            <option value="Ndamage">No Damage</option>
        </select>
    </fieldset>
    <br><br>

    <fieldset>
        <legend>Quais Categorias você mais gosta?</legend>
        <input type="checkbox" name="categoria" value="any"> Any%
        <input type="checkbox" name="categoria" value="100"> 100%
        <input type="checkbox" name="categoria" value="allS"> All Stage
        <input type="checkbox" name="categoria" value="allB"> All Bosses
        <input type="checkbox" name="categoria" value="Ndamage"> No Damage
    </fieldset>

    <h2 class="title">Observações:</h2>
    <textarea id="obs"></textarea>
    <br><br>

    <label>
    <input type="submit" value="Cadastrar">
    </label>

    <label>
    <input type="reset" value="Limpar">
    </label>
</form>
</body>
</html>
